  </text>
  <text x="232" y="146" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="24" font-weight="800" letter-spacing="4" fill="#38bdf8">
    AI
  </text>
  <text x="266" y="146" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="24" font-weight="800" letter-spacing="4" fill="#a3e635">
