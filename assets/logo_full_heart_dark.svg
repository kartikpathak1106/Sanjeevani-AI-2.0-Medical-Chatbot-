  </text>
  <text x="232" y="172" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="600" letter-spacing="2" fill="#94a3b8">
    CARING FOR YOUR HEALTH
  </text>
</svg>
